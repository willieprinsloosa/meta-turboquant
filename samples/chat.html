<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurboQuant Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

header { padding: 12px 20px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 16px; font-weight: 600; color: #e94560; }
header .status { font-size: 12px; color: #666; }
header .status.online { color: #4ecca3; }
header .model { font-size: 12px; color: #888; margin-left: auto; }

#chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

.msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: #0f3460; color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: #222; color: #e0e0e0; border-bottom-left-radius: 4px; }
.msg.assistant .label { font-size: 11px; color: #e94560; margin-bottom: 4px; font-weight: 600; }
.msg.system { align-self: center; background: none; color: #666; font-size: 12px; font-style: italic; }
.msg .stats { font-size: 11px; color: #555; margin-top: 8px; }

.msg code { background: #333; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
.msg pre { background: #111; padding: 10px; border-radius: 6px; margin: 8px 0; overflow-x: auto; }
.msg pre code { background: none; padding: 0; }

.typing { display: inline-block; }
.typing span { display: inline-block; width: 6px; height: 6px; background: #e94560; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }

#input-area { padding: 12px 20px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 8px; }
#input { flex: 1; padding: 10px 14px; background: #222; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; outline: none; font-family: inherit; resize: none; min-height: 42px; max-height: 120px; }
#input:focus { border-color: #e94560; }
#input::placeholder { color: #555; }
#send { padding: 10px 20px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
#send:hover { background: #c73e54; }
#send:disabled { background: #555; cursor: not-allowed; }

.toolbar { padding: 6px 20px; background: #16213e; display: flex; gap: 10px; font-size: 12px; }
.toolbar button { background: none; border: 1px solid #333; color: #888; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.toolbar button:hover { border-color: #e94560; color: #e94560; }
</style>
</head>
<body>

<header>
  <h1>TurboQuant Chat</h1>
  <span id="status" class="status">connecting...</span>
  <span id="model-name" class="model"></span>
</header>

<div class="toolbar">
  <button onclick="clearChat()">Clear</button>
  <button onclick="toggleSystem()">System Prompt</button>
</div>

<div id="chat"></div>

<div id="input-area">
  <textarea id="input" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)"></textarea>
  <button id="send" onclick="sendMessage()">Send</button>
</div>

<script>
const API = 'http://localhost:11434/v1';
let messages = [];
let generating = false;
let modelName = '';

async function checkHealth() {
  try {
    const r = await fetch(`${API.replace('/v1','')}/health`);
    const d = await r.json();
    document.getElementById('status').textContent = 'online';
    document.getElementById('status').className = 'status online';
    modelName = d.model || '';
    document.getElementById('model-name').textContent = modelName.split('/').pop();
  } catch {
    document.getElementById('status').textContent = 'offline';
    document.getElementById('status').className = 'status';
  }
}

function addMessage(role, content, stats) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'assistant') {
    div.innerHTML = `<div class="label">Assistant</div><div class="content"></div>`;
    div.querySelector('.content').textContent = content || '';
  } else if (role === 'system') {
    div.textContent = content;
  } else {
    div.textContent = content;
  }
  if (stats) {
    const s = document.createElement('div');
    s.className = 'stats';
    s.textContent = stats;
    div.appendChild(s);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function setGenerating(v) {
  generating = v;
  document.getElementById('send').disabled = v;
  document.getElementById('input').disabled = v;
  if (!v) document.getElementById('input').focus();
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || generating) return;

  input.value = '';
  input.style.height = 'auto';
  messages.push({ role: 'user', content: text });
  addMessage('user', text);

  setGenerating(true);
  const assistantDiv = addMessage('assistant', '');
  const contentEl = assistantDiv.querySelector('.content');
  contentEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  const start = performance.now();
  let fullText = '';
  let tokenCount = 0;

  try {
    const resp = await fetch(`${API}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: modelName,
        messages: messages,
        stream: true,
        max_tokens: 512,
      }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let streamDone = false;

    while (!streamDone) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') { streamDone = true; break; }
        try {
          const chunk = JSON.parse(data);
          const delta = chunk.choices?.[0]?.delta;
          if (delta?.content) {
            fullText += delta.content;
            tokenCount++;
            contentEl.textContent = fullText;
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
          }
          if (chunk.choices?.[0]?.finish_reason === 'stop') { streamDone = true; break; }
        } catch {}
      }
    }
    reader.cancel();

    const elapsed = (performance.now() - start) / 1000;
    const tps = tokenCount / Math.max(elapsed, 0.001);
    const statsEl = document.createElement('div');
    statsEl.className = 'stats';
    statsEl.textContent = `${tokenCount} tokens, ${elapsed.toFixed(1)}s, ${tps.toFixed(0)} tok/s`;
    assistantDiv.appendChild(statsEl);

    messages.push({ role: 'assistant', content: fullText });
  } catch (err) {
    contentEl.textContent = `Error: ${err.message}`;
    contentEl.style.color = '#e94560';
  }

  setGenerating(false);
}

function clearChat() {
  messages = [];
  document.getElementById('chat').innerHTML = '';
  addMessage('system', 'Chat cleared');
}

function toggleSystem() {
  const current = messages.find(m => m.role === 'system');
  const prompt = window.prompt('System prompt:', current?.content || '');
  if (prompt === null) return;
  messages = messages.filter(m => m.role !== 'system');
  if (prompt.trim()) {
    messages.unshift({ role: 'system', content: prompt.trim() });
    addMessage('system', `System: ${prompt.trim()}`);
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
  // Auto-resize
  setTimeout(() => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  }, 0);
}

checkHealth();
setInterval(checkHealth, 5000);
document.getElementById('input').focus();
</script>
</body>
</html>
