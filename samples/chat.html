<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurboQuant Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

header { padding: 12px 20px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 16px; font-weight: 600; color: #e94560; }
header .status { font-size: 12px; color: #666; }
header .status.online { color: #4ecca3; }
header .model { font-size: 12px; color: #888; margin-left: auto; }

#chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

.msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: #0f3460; color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.assistant { align-self: flex-start; background: #222; color: #e0e0e0; border-bottom-left-radius: 4px; }
.msg.assistant .label { font-size: 11px; color: #e94560; margin-bottom: 4px; font-weight: 600; }
.msg.assistant .content h1, .msg.assistant .content h2, .msg.assistant .content h3 { color: #e94560; margin: 12px 0 6px 0; }
.msg.assistant .content h1 { font-size: 18px; }
.msg.assistant .content h2 { font-size: 16px; }
.msg.assistant .content h3 { font-size: 14px; }
.msg.assistant .content p { margin: 6px 0; }
.msg.assistant .content ul, .msg.assistant .content ol { margin: 6px 0; padding-left: 20px; }
.msg.assistant .content li { margin: 3px 0; }
.msg.assistant .content code { background: #333; padding: 1px 5px; border-radius: 3px; font-family: 'SF Mono', 'Menlo', monospace; font-size: 13px; }
.msg.assistant .content pre { background: #111; padding: 10px; border-radius: 6px; margin: 8px 0; overflow-x: auto; }
.msg.assistant .content pre code { background: none; padding: 0; display: block; }
.msg.assistant .content blockquote { border-left: 3px solid #e94560; padding-left: 10px; margin: 8px 0; color: #aaa; }
.msg.assistant .content table { border-collapse: collapse; margin: 8px 0; width: 100%; }
.msg.assistant .content th, .msg.assistant .content td { border: 1px solid #333; padding: 4px 8px; text-align: left; }
.msg.assistant .content th { background: #1a1a2e; color: #e94560; }
.msg.assistant .content a { color: #4a7aff; text-decoration: none; }
.msg.assistant .content a:hover { text-decoration: underline; }
.msg.assistant .content hr { border: none; border-top: 1px solid #333; margin: 10px 0; }
.msg.assistant .content strong { color: #fff; }
.msg.assistant .content em { color: #ccc; }
.msg.tool-call { align-self: flex-start; background: #1a2744; border: 1px solid #0f3460; color: #4ecca3; font-size: 13px; max-width: 90%; }
.msg.tool-call .tool-label { font-size: 11px; color: #e94560; margin-bottom: 4px; font-weight: 600; }
.msg.tool-call .tool-name { color: #4ecca3; font-weight: 600; }
.msg.tool-call .tool-args { color: #aaa; font-size: 12px; margin-top: 4px; }
.msg.tool-result { align-self: flex-start; background: #1a2e1a; border: 1px solid #2d5a2d; color: #8bc34a; font-size: 13px; max-width: 90%; }
.msg.tool-result .tool-label { font-size: 11px; color: #8bc34a; margin-bottom: 4px; font-weight: 600; }
.msg.system { align-self: center; background: none; color: #666; font-size: 12px; font-style: italic; }
.msg .stats { font-size: 11px; color: #555; margin-top: 8px; }

.typing { display: inline-block; }
.typing span { display: inline-block; width: 6px; height: 6px; background: #e94560; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }

#input-area { padding: 12px 20px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 8px; }
#input { flex: 1; padding: 10px 14px; background: #222; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; outline: none; font-family: inherit; resize: none; min-height: 42px; max-height: 120px; }
#input:focus { border-color: #e94560; }
#input::placeholder { color: #555; }
#send { padding: 10px 20px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
#send:hover { background: #c73e54; }
#send:disabled { background: #555; cursor: not-allowed; }

.toolbar { padding: 6px 20px; background: #16213e; display: flex; gap: 10px; font-size: 12px; align-items: center; }
.toolbar button { background: none; border: 1px solid #333; color: #888; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.toolbar button:hover { border-color: #e94560; color: #e94560; }
.toolbar button.active { border-color: #4ecca3; color: #4ecca3; }
.toolbar .tools-status { margin-left: auto; font-size: 11px; color: #555; }
</style>
</head>
<body>

<header>
  <h1>TurboQuant Chat</h1>
  <span id="status" class="status">connecting...</span>
  <span id="model-name" class="model"></span>
</header>

<div class="toolbar">
  <button onclick="clearChat()">Clear</button>
  <button onclick="toggleSystem()">System Prompt</button>
  <button id="tools-btn" onclick="toggleTools()">Tools: OFF</button>
  <span class="tools-status" id="tools-status"></span>
</div>

<div id="chat"></div>

<div id="input-area">
  <textarea id="input" placeholder="Type a message... (try 'What's the weather in Tokyo?' with tools on)" rows="1" onkeydown="handleKey(event)"></textarea>
  <button id="send" onclick="sendMessage()">Send</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// Configure marked for safe rendering
marked.setOptions({ breaks: true, gfm: true });

function renderMarkdown(text) {
  try { return marked.parse(text); }
  catch { return text; }
}

const API = 'http://localhost:11434/v1';
let messages = [];
let generating = false;
let modelName = '';
let toolsEnabled = false;

// --- Demo tools (simulated) ---
const TOOLS = [
  {
    type: 'function',
    function: {
      name: 'get_weather',
      description: 'Get the current weather for a city',
      parameters: { type: 'object', properties: { city: { type: 'string', description: 'City name' }, unit: { type: 'string', enum: ['celsius', 'fahrenheit'] } }, required: ['city'] },
    },
  },
  {
    type: 'function',
    function: {
      name: 'search_web',
      description: 'Search the web for information',
      parameters: { type: 'object', properties: { query: { type: 'string', description: 'Search query' } }, required: ['query'] },
    },
  },
  {
    type: 'function',
    function: {
      name: 'calculate',
      description: 'Evaluate a mathematical expression',
      parameters: { type: 'object', properties: { expression: { type: 'string', description: 'Math expression' } }, required: ['expression'] },
    },
  },
  {
    type: 'function',
    function: {
      name: 'get_time',
      description: 'Get the current date and time',
      parameters: { type: 'object', properties: { timezone: { type: 'string', description: 'Timezone (e.g. UTC, US/Eastern)' } }, required: [] },
    },
  },
];

// Simulated tool execution
function executeTool(name, args) {
  switch (name) {
    case 'get_weather': {
      const city = args.city || 'Unknown';
      const temps = { 'tokyo': 22, 'london': 15, 'paris': 18, 'new york': 12, 'sydney': 25 };
      const conditions = { 'tokyo': 'sunny', 'london': 'rainy', 'paris': 'cloudy', 'new york': 'windy', 'sydney': 'sunny' };
      const temp = temps[city.toLowerCase()] || Math.floor(Math.random() * 30 + 5);
      const cond = conditions[city.toLowerCase()] || 'partly cloudy';
      const unit = args.unit === 'fahrenheit' ? 'F' : 'C';
      const t = unit === 'F' ? Math.round(temp * 9/5 + 32) : temp;
      return JSON.stringify({ city, temperature: t, unit, condition: cond, humidity: Math.floor(Math.random() * 40 + 40) });
    }
    case 'search_web':
      return JSON.stringify({ results: [
        { title: `Top result for: ${args.query}`, snippet: `Here is the latest information about ${args.query}. This is simulated search data for demo purposes.` },
        { title: `${args.query} - Wikipedia`, snippet: `${args.query} is a topic of significant interest...` },
      ]});
    case 'calculate': {
      try { return JSON.stringify({ expression: args.expression, result: eval(args.expression) }); }
      catch { return JSON.stringify({ expression: args.expression, error: 'Could not evaluate' }); }
    }
    case 'get_time': {
      const now = new Date();
      return JSON.stringify({ timezone: args.timezone || 'local', datetime: now.toISOString(), formatted: now.toLocaleString() });
    }
    default:
      return JSON.stringify({ error: `Unknown tool: ${name}` });
  }
}

async function checkHealth() {
  try {
    const r = await fetch(`${API.replace('/v1','')}/health`);
    const d = await r.json();
    document.getElementById('status').textContent = 'online';
    document.getElementById('status').className = 'status online';
    modelName = d.model || '';
    document.getElementById('model-name').textContent = modelName.split('/').pop();
  } catch {
    document.getElementById('status').textContent = 'offline';
    document.getElementById('status').className = 'status';
  }
}

function addMessage(role, content, stats) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'assistant') {
    div.innerHTML = `<div class="label">Assistant</div><div class="content"></div>`;
    const contentEl = div.querySelector('.content');
    if (content) {
      contentEl.innerHTML = renderMarkdown(content);
    }
  } else if (role === 'system') {
    div.textContent = content;
  } else {
    div.textContent = content;
  }
  if (stats) {
    const s = document.createElement('div');
    s.className = 'stats';
    s.textContent = stats;
    div.appendChild(s);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addToolCallMessage(name, args) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg tool-call';
  div.innerHTML = `<div class="tool-label">Tool Call</div><div class="tool-name">${name}()</div><div class="tool-args">${JSON.stringify(args, null, 2)}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addToolResultMessage(name, result) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg tool-result';
  try {
    const parsed = JSON.parse(result);
    div.innerHTML = `<div class="tool-label">Tool Result: ${name}</div><div>${JSON.stringify(parsed, null, 2)}</div>`;
  } catch {
    div.innerHTML = `<div class="tool-label">Tool Result: ${name}</div><div>${result}</div>`;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setGenerating(v) {
  generating = v;
  document.getElementById('send').disabled = v;
  document.getElementById('input').disabled = v;
  if (!v) document.getElementById('input').focus();
}

async function callLLM(msgs, useTools) {
  const body = {
    model: modelName,
    messages: msgs,
    max_tokens: 512,
  };

  if (useTools) {
    // Non-streaming for tool calls (server forces this anyway)
    body.tools = TOOLS;
    body.stream = false;
    const resp = await fetch(`${API}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return await resp.json();
  } else {
    // Streaming for normal chat
    body.stream = true;
    const resp = await fetch(`${API}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return resp;
  }
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || generating) return;

  input.value = '';
  input.style.height = 'auto';
  messages.push({ role: 'user', content: text });
  addMessage('user', text);

  setGenerating(true);
  const start = performance.now();

  try {
    if (toolsEnabled) {
      await handleToolFlow(start);
    } else {
      await handleStreamFlow(start);
    }
  } catch (err) {
    addMessage('system', `Error: ${err.message}`);
  }

  setGenerating(false);
}

async function handleToolFlow(start) {
  // Tool calling loop — may iterate multiple times
  let iterations = 0;
  const maxIterations = 5;

  while (iterations < maxIterations) {
    iterations++;
    const assistantDiv = addMessage('assistant', '');
    const contentEl = assistantDiv.querySelector('.content');
    contentEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

    const result = await callLLM(messages, true);
    const choice = result.choices?.[0];
    const msg = choice?.message;

    if (choice?.finish_reason === 'tool_calls' && msg?.tool_calls?.length) {
      // Show thinking indicator briefly then remove
      if (msg.content) { contentEl.innerHTML = renderMarkdown(msg.content); }
      else { assistantDiv.remove(); }

      // Add assistant message with tool_calls to history
      messages.push(msg);

      // Execute each tool call
      for (const tc of msg.tool_calls) {
        const args = JSON.parse(tc.function.arguments);
        addToolCallMessage(tc.function.name, args);

        // Execute the tool
        const toolResult = executeTool(tc.function.name, args);
        addToolResultMessage(tc.function.name, toolResult);

        // Add tool result to history
        messages.push({ role: 'tool', tool_call_id: tc.id, content: toolResult });
      }
      // Continue loop — model will process tool results
    } else {
      // Normal text response — done
      const text = msg?.content || '';
      contentEl.innerHTML = renderMarkdown(text);
      messages.push({ role: 'assistant', content: text });

      const elapsed = (performance.now() - start) / 1000;
      const statsEl = document.createElement('div');
      statsEl.className = 'stats';
      statsEl.textContent = `${result.usage?.completion_tokens || '?'} tokens, ${elapsed.toFixed(1)}s`;
      assistantDiv.appendChild(statsEl);
      break;
    }
  }
}

async function handleStreamFlow(start) {
  const assistantDiv = addMessage('assistant', '');
  const contentEl = assistantDiv.querySelector('.content');
  contentEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  let fullText = '';
  let tokenCount = 0;

  const resp = await callLLM(messages, false);
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let streamDone = false;

  while (!streamDone) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6);
      if (data === '[DONE]') { streamDone = true; break; }
      try {
        const chunk = JSON.parse(data);
        const delta = chunk.choices?.[0]?.delta;
        if (delta?.content) {
          fullText += delta.content;
          tokenCount++;
          contentEl.innerHTML = renderMarkdown(fullText);
          document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }
        if (chunk.choices?.[0]?.finish_reason === 'stop') { streamDone = true; break; }
      } catch {}
    }
  }
  reader.cancel();

  const elapsed = (performance.now() - start) / 1000;
  const tps = tokenCount / Math.max(elapsed, 0.001);
  const statsEl = document.createElement('div');
  statsEl.className = 'stats';
  statsEl.textContent = `${tokenCount} tokens, ${elapsed.toFixed(1)}s, ${tps.toFixed(0)} tok/s`;
  assistantDiv.appendChild(statsEl);

  messages.push({ role: 'assistant', content: fullText });
}

function clearChat() {
  messages = [];
  document.getElementById('chat').innerHTML = '';
  addMessage('system', 'Chat cleared');
}

function toggleSystem() {
  const current = messages.find(m => m.role === 'system');
  const prompt = window.prompt('System prompt:', current?.content || '');
  if (prompt === null) return;
  messages = messages.filter(m => m.role !== 'system');
  if (prompt.trim()) {
    messages.unshift({ role: 'system', content: prompt.trim() });
    addMessage('system', `System: ${prompt.trim()}`);
  }
}

function toggleTools() {
  toolsEnabled = !toolsEnabled;
  const btn = document.getElementById('tools-btn');
  btn.textContent = toolsEnabled ? 'Tools: ON' : 'Tools: OFF';
  btn.className = toolsEnabled ? 'active' : '';
  document.getElementById('tools-status').textContent = toolsEnabled
    ? 'weather, search, calculate, time'
    : '';
  addMessage('system', toolsEnabled
    ? 'Tools enabled: get_weather, search_web, calculate, get_time'
    : 'Tools disabled — streaming mode');
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
  setTimeout(() => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  }, 0);
}

checkHealth();
setInterval(checkHealth, 5000);
document.getElementById('input').focus();
</script>
</body>
</html>
